<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>13 — Card detail popover | stimulus_kanban</title>
  <link rel="stylesheet" href="../dist/stimulus_kanban.css" />
  <link rel="stylesheet" href="_shared.css" />
</head>
<body>
  <p class="crumbs"><a href="./">← demos</a></p>
  <h1>13 — Card detail popover</h1>
  <p class="lede">Press <kbd>Enter</kbd> on a focused card, or call <code>boardApi.openCardDetail(id)</code>. The popover is cloned from the named <code>&lt;template&gt;</code>.</p>

  <template id="story-detail">
    <aside>
      <header>
        <h3 data-bind="title"></h3>
        <button data-detail-close class="sk-button">×</button>
      </header>
      <dl>
        <dt>Status</dt><dd data-bind="status"></dd>
        <dt>Assignee</dt><dd data-bind="assignee_name"></dd>
        <dt>Points</dt><dd data-bind="points"></dd>
        <dt>Created</dt><dd data-bind="created_at"></dd>
      </dl>
      <p data-bind="description"></p>
    </aside>
  </template>

  <div class="panel"
       data-controller="board"
       data-board-card-detail-template-value="story-detail"
       data-board-detail-layout-value="popover"
       id="board">
    <ol class="sk-columns">
      <li data-controller="board-column" data-board-column-id-value="todo"  data-board-column-title-value="To do"><ol class="sk-cards"></ol></li>
      <li data-controller="board-column" data-board-column-id-value="doing" data-board-column-title-value="Doing"><ol class="sk-cards"></ol></li>
      <li data-controller="board-column" data-board-column-id-value="done"  data-board-column-title-value="Done"><ol class="sk-cards"></ol></li>
    </ol>
  </div>

  <script src="../dist/stimulus_kanban.js"></script>
  <script>
    StimulusKanban.start();
    document.getElementById('board').addEventListener('board:ready', (ev) => {
      ev.detail.api.setCardData([
        { id: 1, column_id: 'todo',  title: 'Build admin index',       status: 'todo',  assignee_name: 'Alice', points: 5, created_at: '2026-04-12', description: 'Initial index page wired to the boardApi.' },
        { id: 2, column_id: 'doing', title: 'Wire Turbo Stream sync',  status: 'doing', assignee_name: 'Bob',   points: 8, created_at: '2026-04-18', description: 'Broadcast every move through ActionCable.' },
        { id: 3, column_id: 'done',  title: 'Write README',            status: 'done',  assignee_name: 'Carol', points: 2, created_at: '2026-04-09', description: 'Ship the install + quick-start sections.' },
      ]);
    });
  </script>
</body>
</html>
